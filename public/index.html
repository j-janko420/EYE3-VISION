<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE3-VISION Smart TV</title>
<style>
body{margin:0;font-family:sans-serif;background:#0b0b12;color:#eee}
nav{display:flex;gap:6px;padding:8px;background:#161625}nav button{padding:10px 16px;background:#24243a;color:#eee;border:0;border-radius:6px;cursor:pointer}
nav button.on{background:#6a5cff}main{padding:12px}section{display:none}section.on{display:block}
input,select{padding:8px;background:#1e1e30;color:#eee;border:1px solid #444;border-radius:4px;margin:2px}
video{width:100%;max-height:60vh;background:#000}iframe{width:100%;height:75vh;border:0;background:#fff}
#pllist{max-height:30vh;overflow:auto}#pllist div{padding:6px;cursor:pointer;border-bottom:1px solid #222}#list{max-height:30vh;overflow:auto}#list div{padding:6px;cursor:pointer;border-bottom:1px solid #222}#list div:hover{background:#24243a}
</style></head><body>
<nav id="nav"><button data-t="iptv" class="on">IPTV / MAG Portal</button><button data-t="plugins">Connectors</button><button data-t="stream">Online Streaming</button><button data-t="web">Web Browser</button><button data-t="mirror">Mirror TV</button></nav>
<main>
<section id="iptv" class="on">
 <input id="portal" size="40" placeholder="Portal URL http://host/c/">
 <input id="mac" size="18" title="Virtual MAC ID">
 <button onclick="connect()">Connect</button> <span id="status"></span><br>
 <input id="m3u" size="40" placeholder="M3U playlist URL"><button onclick="loadM3U()">Load M3U</button>
 <br><select id="genre" onchange="chans()"></select>
 <div id="list"></div>
</section>
<section id="plugins"><select id="pl" onchange="plPick()"></select><span id="plf"></span>
 <button onclick="plList()">Load</button> <label><input type="checkbox" id="tc"> Transcode (ffmpeg)</label> <span id="plst"></span><div id="pllist"></div></section>
<section id="stream"><input id="surl" size="50" placeholder="HLS (.m3u8) / MP4 / DASH URL"><button onclick="play($('surl').value)">Play</button></section>
<section id="web"><input id="wurl" size="50" placeholder="https://..."><button onclick="$('frame').src=$('wurl').value">Go</button>
 <p><small>Sites that forbid embedding (X-Frame-Options) will not load; use "Open in tab".</small> <button onclick="window.open($('wurl').value)">Open in tab</button></p><iframe id="frame"></iframe></section>
<section id="mirror"><button onclick="mirror()">Start screen mirror</button><button onclick="stopMirror()">Stop</button>
 <p><small>Uses the browser Screen Capture API (cast phone/PC screen by opening this page there, or use the browser's share). Works on HTTPS or localhost.</small></p><video id="mv" autoplay playsinline controls></video></section>
<video id="player" controls autoplay></video>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="app.js"></script></body></html>
