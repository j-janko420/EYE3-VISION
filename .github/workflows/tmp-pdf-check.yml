name: tmp pdf check
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-pdf-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: CDN files exist
        run: |
          for f in pdf.min.js pdf.worker.min.js; do curl -sS -o /dev/null -w "$f %{http_code} %{size_download}\n" "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/$f"; done
      - name: Install Playwright
        run: |
          mkdir /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1; echo installed
      - name: Run the PDF import test against the real CDN
        run: |
          cp .github/workflows/tmp-pdf-check.yml /dev/null
          python3 -m http.server 8099 >/dev/null 2>&1 &
          sleep 1
          cat > /tmp/t/t.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const c=await b.newContext();
           const mk=async(html,file)=>{const p=await c.newPage();await p.setContent(html);await p.pdf({path:file});await p.close();};
           await mk('<pre>#EXTM3U\n#EXTINF:-1 group-title="News",PDF News One\nhttps://example.com/one.m3u8\n#EXTINF:-1 group-title="Adult XXX",Hidden One\nhttps://example.com/hidden.m3u8\n</pre>','/tmp/t/m3u.pdf');
           await mk('<h2>My channels</h2><p>1. Sport HD - https://example.com/sport.m3u8</p><p>Movie Channel</p><p>https://example.com/movie/live.m3u8?token=abc123</p><p>https://example.com/bare.m3u8</p><p>no link here</p>','/tmp/t/list.pdf');
           await mk('<div style="height:100px"></div>','/tmp/t/blank.pdf');
           const p=await c.newPage();const errs=[];p.on('pageerror',e=>errs.push(e.message));
           await p.goto('http://localhost:8099/home/?add=playlist',{waitUntil:'domcontentloaded'});await p.waitForTimeout(800);
           const mine=async()=>p.evaluate(()=>JSON.parse(localStorage.getItem('eye3.home.mychannels')||'[]').map(c=>c.n+' | '+c.u));
           for (const f of ['m3u','list','blank']){
             await p.setInputFiles('#mk-import','/tmp/t/'+f+'.pdf');await p.waitForTimeout(7000);
             console.log(f+'.pdf ->',await p.textContent('#mk-msg'));
           }
           console.log('stored:',JSON.stringify(await mine(),null,1));
           console.log('errors',errs);await b.close()})();
          JS
          cd /tmp/t && NODE_PATH=/tmp/t/node_modules node t.js
