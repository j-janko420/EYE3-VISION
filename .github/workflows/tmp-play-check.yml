name: tmp play check
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-play-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: CDN files and test media
        run: |
          curl -sS -o /dev/null -w "mpegts.js %{http_code} %{size_download}\n" https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js
          curl -sS -o /dev/null -w "hls.js %{http_code} %{size_download}\n" https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js
          sudo apt-get install -y ffmpeg >/dev/null 2>&1; ffmpeg -version | head -1
          mkdir -p /tmp/media/hls
          ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=440 -t 12 -c:v libx264 -pix_fmt yuv420p -c:a aac -f mpegts /tmp/media/live.ts
          ffmpeg -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=440 -t 12 -c:v libx264 -pix_fmt yuv420p -c:a aac -f hls -hls_time 2 -hls_playlist_type vod -hls_segment_filename "/tmp/media/hls/s%d.ts" /tmp/media/hls/index.m3u8
          ls -la /tmp/media /tmp/media/hls | head -20
      - name: Install Playwright and Chrome
        run: |
          mkdir /tmp/t && cd /tmp/t && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chrome >/dev/null 2>&1; echo installed
      - name: Play real TS and HLS in Home
        run: |
          python3 -m http.server 8099 >/dev/null 2>&1 &
          cat > /tmp/cors.py <<'PY'
          import http.server, os
          os.chdir("/tmp/media")
          class H(http.server.SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("Access-Control-Allow-Origin", "*"); self.send_header("Access-Control-Allow-Headers", "*"); super().end_headers()
              def log_message(self, f, *a):
                  open("/tmp/media_hits.log", "a").write(self.path + "\n")
          http.server.ThreadingHTTPServer(("127.0.0.1", 9300), H).serve_forever()
          PY
          python3 /tmp/cors.py &
          sleep 1
          cat > /tmp/t/t.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({channel:'chrome'});const c=await b.newContext();const p=await c.newPage();const errs=[],cons=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')cons.push(m.text().slice(0,160))});
           await p.addInitScript(()=>{localStorage.setItem('eye3.home.mychannels',JSON.stringify([{n:'Real TS',u:'http://127.0.0.1:9300/live.ts',g:'',l:'',i:''},{n:'Real HLS',u:'http://127.0.0.1:9300/hls/index.m3u8',g:'',l:'',i:''},{n:'Dead HLS',u:'http://127.0.0.1:9300/nope/index.m3u8',g:'',l:'',i:''}]));});
           await p.goto('http://localhost:8099/home/?splash=0',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1500);
           await p.evaluate(()=>document.querySelector('.tile').click());await p.waitForTimeout(2500);
           await p.selectOption('#tv-cat',{label:await p.evaluate(()=>[...document.querySelectorAll('#tv-cat option')].map(o=>o.textContent).find(t=>t.startsWith('My channels')))});await p.waitForTimeout(500);
           for (const name of ['Real TS','Real HLS','Dead HLS']) {
             await p.click('#chlist .ch >> text='+name);await p.waitForTimeout(7000);
             const st=await p.evaluate(()=>{const v=document.getElementById('video');return {t:+v.currentTime.toFixed(2),paused:v.paused,ready:v.readyState,w:v.videoWidth,h:v.videoHeight,mpegts:!!window.mpegts,hls:!!window.Hls,label:document.getElementById('chlabel').textContent.slice(0,70)}});
             console.log(name,'->',JSON.stringify(st));
           }
           console.log('page errors:',errs);console.log('console errors:',cons);
           await b.close()})();
          JS
          cd /tmp/t && NODE_PATH=/tmp/t/node_modules node t.js
          echo "--- media server hits:"; sort /tmp/media_hits.log | uniq -c | head -20
