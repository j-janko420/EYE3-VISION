<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050101">
<meta name="description" content="EYE3 Remote — turn your phone into the remote for EYE3 on your TV.">
<title>EYE3 Remote</title>
<style>
  :root { color-scheme: dark; --bg:#050101; --ink:#fff5f6; --muted:#b9a9ac; --line:rgba(255,255,255,.16); --panel:#1a070b; --orange:#ff263f; --cream:#fff5f6; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body { min-height:100dvh; background: radial-gradient(circle at 30% 10%, rgba(255,38,63,.6) 0, transparent 50%), var(--bg); color: var(--ink); display:flex; flex-direction:column; padding: max(14px, env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap:14px; user-select:none; }
  .top { display:flex; align-items:center; gap:12px; }
  .badge { display:grid; place-items:center; width:44px; height:44px; border:3px solid var(--cream); border-radius:10px; background:#140609; color:var(--cream); font-weight:800; line-height:.9; text-align:center; }
  .badge b{font-size:18px} .badge span{font-size:7px; letter-spacing:1px; color:var(--orange)}
  h1 { margin:0; font-size:18px; letter-spacing:.1em; color:var(--orange); }
  .sub { margin:2px 0 0; color:var(--muted); font-size:12px; }
  #connect { border:1px solid var(--line); border-radius:16px; background:rgba(26,7,11,.7); padding:16px; }
  #connect p { margin:0 0 10px; color:var(--muted); font-size:14px; line-height:1.5; }
  .code-in { display:flex; gap:10px; }
  .code-in input { flex:1; min-width:0; padding:14px; border:2px solid var(--line); border-radius:12px; background:#0b0506; color:var(--ink); font-size:22px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; text-align:center; }
  .btn { border:2px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink); font-size:16px; font-weight:650; padding:14px 18px; cursor:pointer; }
  .btn.primary { background:#3a0d14; border-color:var(--orange); color:#fff; }
  .status { margin-top:10px; color:var(--muted); font-size:13px; min-height:18px; }
  .status.good { color:#9ff0d4; } .status.bad { color:#ffb3ad; }

  #pad { flex:1; display:none; flex-direction:column; gap:14px; }
  #pad.on { display:flex; }
  .dpad { position:relative; width:min(78vw, 320px); aspect-ratio:1; margin:6px auto 0; }
  .key { position:absolute; display:grid; place-items:center; border:2px solid var(--line); background:var(--panel); color:var(--ink); border-radius:18px; font-size:30px; font-weight:700; cursor:pointer; }
  .key:active { background:#3a0d14; border-color:var(--orange); transform:scale(.96); }
  .k-up { left:33.5%; top:0; width:33%; height:33%; border-radius:18px 18px 0 0; }
  .k-down { left:33.5%; bottom:0; width:33%; height:33%; border-radius:0 0 18px 18px; }
  .k-left { left:0; top:33.5%; width:33%; height:33%; border-radius:18px 0 0 18px; }
  .k-right { right:0; top:33.5%; width:33%; height:33%; border-radius:0 18px 18px 0; }
  .k-ok { left:33.5%; top:33.5%; width:33%; height:33%; border:3px solid var(--orange); background:#3a0d14; color:#fff; font-size:20px; letter-spacing:.08em; }
  .rowbtns { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .rowbtns .btn { padding:16px 8px; font-size:15px; }
  .chrow { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .chrow .btn { padding:16px; font-size:16px; }
  .nums { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .nums .btn { padding:14px 0; font-size:20px; }
  .hide { display:none; }
  .foot { color:var(--muted); font-size:11px; text-align:center; }
</style>
</head>
<body>
<div class="top">
  <div class="badge"><b>i3</b><span>DESIGN</span></div>
  <div><h1>EYE3 REMOTE</h1><p class="sub" id="sub">Control EYE3 on your TV</p></div>
</div>

<section id="connect">
  <p>On the TV, open <b>EYE3 TV → Phone remote</b>. It shows an 8-character code. Type it here (same internet). For EYE3 Home on a laptop, use <b>Settings → Phone remote</b>:</p>
  <div class="code-in">
    <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD-EFGH">
    <button class="btn primary" id="go" type="button">Connect</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
</section>

<section id="pad">
  <div class="dpad">
    <button class="key k-up" data-cmd="up" type="button" aria-label="Up">▲</button>
    <button class="key k-left" data-cmd="left" type="button" aria-label="Left">◀</button>
    <button class="key k-ok" data-cmd="ok" type="button" aria-label="OK">OK</button>
    <button class="key k-right" data-cmd="right" type="button" aria-label="Right">▶</button>
    <button class="key k-down" data-cmd="down" type="button" aria-label="Down">▼</button>
  </div>
  <div class="rowbtns">
    <button class="btn" data-cmd="back" type="button">↩ Back</button>
    <button class="btn" data-cmd="home" type="button">⌂ Home</button>
    <button class="btn" id="toggle-nums" type="button"># Numbers</button>
  </div>
  <div class="chrow">
    <button class="btn" data-cmd="chup" type="button">CH ▲</button>
    <button class="btn" data-cmd="chdown" type="button">CH ▼</button>
  </div>
  <div class="rowbtns">
    <button class="btn" data-cmd="tv" type="button">📺 TV</button>
    <button class="btn" data-cmd="radio" type="button">📻 Radio</button>
    <button class="btn" data-cmd="media" type="button">💾 Media</button>
  </div>
  <div class="rowbtns">
    <button class="btn" data-cmd="voldown" type="button">🔉 Vol −</button>
    <button class="btn" data-cmd="mute" type="button">🔇 Mute</button>
    <button class="btn" data-cmd="volup" type="button">🔊 Vol +</button>
  </div>
  <div class="rowbtns">
    <button class="btn" data-cmd="play" type="button">⏯ Play</button>
    <button class="btn" data-cmd="sleep" type="button">😴 Sleep</button>
    <button class="btn" data-cmd="saver" type="button">🌙 Saver</button>
  </div>
  <div class="nums hide" id="nums"></div>
  <div class="foot" id="foot"></div>
</section>

<script>
(function () {
  "use strict";
  var LOCAL = ["localhost", "127.0.0.1"].indexOf(location.hostname) !== -1;
  function params(name) { try { var m = new RegExp("[?#&]" + name + "=([^&#]+)").exec(location.href); return m ? decodeURIComponent(m[1]) : ""; } catch (e) { return ""; } }
  var SIGNAL = (LOCAL && params("signal")) || "https://ntfy.sh";
  var ALPHA = /^[A-Z0-9]{8}$/;

  var $ = function (id) { return document.getElementById(id); };
  var topic = "", connected = false, lastSent = 0;

  function normalize(v) { return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8); }
  function setStatus(text, tone) { var s = $("status"); s.textContent = text; s.className = "status" + (tone ? " " + tone : ""); }

  function send(cmd) {
    if (!topic) return;
    var now = Date.now();
    if (cmd === lastCmd && now - lastSent < 90) return; // debounce accidental double-fire
    lastSent = now; lastCmd = cmd;
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    try {
      fetch(SIGNAL + "/" + topic, { method: "POST", body: cmd }).catch(function () {});
    } catch (e) {
      try { var xhr = new XMLHttpRequest(); xhr.open("POST", SIGNAL + "/" + topic, true); xhr.send(cmd); } catch (e2) {}
    }
  }
  var lastCmd = "";

  function connect(code) {
    if (!ALPHA.test(code)) { setStatus("Enter the 8-character code shown on the TV.", "bad"); return; }
    topic = "eye3rc-" + code.toLowerCase();
    connected = true;
    $("connect").className = "hide";
    $("pad").className = "on";
    $("sub").textContent = "Connected · code " + code.slice(0, 4) + "-" + code.slice(4);
    $("foot").textContent = "Point and tap. If the TV does not respond, check both devices are online and the TV page is still open.";
    send("hello");
    try { localStorage.setItem("eye3.rc.last", code); } catch (e) {}
  }

  $("go").addEventListener("click", function () { connect(normalize($("code").value)); });
  $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") $("go").click(); });
  try { var last = localStorage.getItem("eye3.rc.last"); if (last) $("code").value = last.slice(0, 4) + "-" + last.slice(4); } catch (e) {}

  // buttons
  function wire(el) {
    var cmd = el.getAttribute("data-cmd");
    var fire = function (ev) { ev.preventDefault(); send(cmd); };
    el.addEventListener("touchstart", fire, { passive: false });
    el.addEventListener("click", function (ev) { if (ev.detail) send(cmd); }); // mouse/keyboard, not synthetic after touch
  }
  [].slice.call(document.querySelectorAll("[data-cmd]")).forEach(wire);

  // number pad
  var nums = $("nums");
  "123456789".split("").concat(["", "0", ""]).forEach(function (d) {
    if (!d) { nums.appendChild(document.createElement("span")); return; }
    var b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = d;
    var fire = function (ev) { ev.preventDefault(); send("digit:" + d); };
    b.addEventListener("touchstart", fire, { passive: false });
    b.addEventListener("click", function (ev) { if (ev.detail) send("digit:" + d); });
    nums.appendChild(b);
  });
  $("toggle-nums").addEventListener("click", function () { nums.classList.toggle("hide"); });

  // auto-connect if the TV's QR link carried the code (press-free is fine here: the phone is the sender)
  var pre = normalize(params("c"));
  if (ALPHA.test(pre)) connect(pre);
  else setStatus("");
})();
</script>
</body>
</html>
